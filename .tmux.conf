# =============================================================================
# tmux.conf — SSH + Claude Code 워크플로우 최적화
# 요구사항: tmux 3.2+ (3.5a 권장)
# =============================================================================

# --- Prefix ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- 기본 설정 ---
set -g default-terminal "tmux-256color"  # 유니코드/컬러 지원 우수
set -g history-limit 50000           # 스크롤백 대폭 확대 (기본 2000)
set -g escape-time 0                 # ESC 지연 제거 (vim 사용자 필수)
set -g display-time 3000             # 메시지 표시 시간 3초
set -g repeat-time 300               # 반복 입력 대기 시간
set -g focus-events on               # 포커스 이벤트 전달
set -g mouse off                     # 텍스트 선택: 그냥 드래그
                                     # 스크롤: prefix + Enter → copy-mode

# --- 번호 매기기 ---
set -g base-index 1                  # 윈도우 1번부터
setw -g pane-base-index 1            # 패널도 1번부터
set -g renumber-windows on           # 윈도우 닫으면 번호 재정렬

# --- 윈도우 & 패널 분할 ---
bind | split-window -h -c "#{pane_current_path}"   # 수평 분할 (현재 경로 유지)
bind - split-window -v -c "#{pane_current_path}"   # 수직 분할 (현재 경로 유지)
bind c new-window -c "#{pane_current_path}"         # 새 윈도우도 현재 경로

# --- 패널 이동 (vim 스타일) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- 패널 리사이즈 ---
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# --- 윈도우 전환 (Ctrl+Shift+방향키, prefix 불필요) ---
bind -n C-S-Left  previous-window
bind -n C-S-Right next-window

# --- 빠른 조작 ---
bind r source-file ~/.tmux.conf \; display "Config reloaded!"  # prefix + r = 설정 리로드
bind X confirm-before -p "kill-session? (y/n)" kill-session     # 세션 종료 확인
bind S command-prompt -p "new session:" "new-session -s '%%'"   # 빠른 세션 생성

# --- 복사 모드 (vi 스타일) ---
setw -g mode-keys vi
bind Enter copy-mode                            # prefix + Enter = 복사 모드 진입
bind -T copy-mode-vi v send -X begin-selection  # v로 선택 시작
bind -T copy-mode-vi y send -X copy-selection   # y로 복사

# --- Dracula 테마 ---
set -g @dracula-plugins "cpu-usage ram-usage git time"
set -g @dracula-show-powerline false
set -g @dracula-show-left-icon session
set -g @dracula-border-contrast true
set -g @dracula-show-empty-plugins false
set -g @dracula-military-time true
set -g @dracula-show-timezone false
set -g @dracula-day-month true
set -g @dracula-refresh-rate 5
set -g @dracula-git-no-repo-message ""
set -g @dracula-cpu-usage-label "CPU"
set -g @dracula-ram-usage-label "RAM"

# --- Dracula 플러그인 직접 로드 (TPM 경로 충돌 방지) ---
run '~/.tmux/plugins/tmux-dracula/dracula.tmux'

# --- 플러그인 (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect 설정
set -g @resurrect-capture-pane-contents 'on'    # 패널 내용도 저장
set -g @continuum-restore 'on'                  # tmux 시작 시 자동 복원
set -g @continuum-save-interval '15'            # 15분마다 자동 저장

# --- SSH 연결 끊김 대비 ---
set -g destroy-unattached off        # 연결 끊겨도 세션 유지
set -g detach-on-destroy off         # 세션 종료 시 다른 세션으로 전환

# --- 활동 알림 ---
setw -g monitor-activity on
set -g visual-activity off           # 메시지 대신 상태바 하이라이트로만 알림

# --- TPM 초기화 (반드시 맨 아래) ---
run '~/.tmux/plugins/tpm/tpm'
