# =============================================================================
# tmux.conf — SSH + Claude Code 워크플로우 최적화
# 요구사항: tmux 3.2+ (3.5a 권장, Ctrl+Shift 키 조합 및 유니코드 지원)
# =============================================================================

# --- Prefix ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- 기본 설정 ---
set -g default-terminal "tmux-256color"  # 유니코드/컬러 지원 우수
set -g history-limit 50000           # 스크롤백 대폭 확대 (기본 2000)
set -g escape-time 0                 # ESC 지연 제거 (vim 사용자 필수)
set -g display-time 3000             # 메시지 표시 시간 3초
set -g repeat-time 300               # 반복 입력 대기 시간
set -g focus-events on               # 포커스 이벤트 전달
set -g mouse on                      # 패널별 스크롤 + 클릭 패널 전환
                                     # 텍스트 선택: tmux 드래그 선택 → y로 복사

# --- 번호 매기기 ---
set -g base-index 1                  # 윈도우 1번부터
setw -g pane-base-index 1            # 패널도 1번부터
set -g renumber-windows on           # 윈도우 닫으면 번호 재정렬

# --- 윈도우 & 패널 분할 ---
bind | split-window -h -c "#{pane_current_path}"   # 수평 분할 (현재 경로 유지)
bind - split-window -v -c "#{pane_current_path}"   # 수직 분할 (현재 경로 유지)
bind c new-window -c "#{pane_current_path}"         # 새 윈도우도 현재 경로

# --- 패널 이동 (vim 스타일) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- 패널 리사이즈 ---
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# --- 윈도우 전환 (Ctrl+Shift+방향키, prefix 불필요) ---
bind -n C-S-Left  previous-window
bind -n C-S-Right next-window

# --- 빠른 조작 ---
bind r source-file ~/.tmux.conf \; display "Config reloaded!"  # prefix + r = 설정 리로드
bind X confirm-before -p "kill-session? (y/n)" kill-session     # 세션 종료 확인
bind S command-prompt -p "new session:" "new-session -s '%%'"   # 빠른 세션 생성

# --- 복사 모드 (vi 스타일) ---
setw -g mode-keys vi
bind Enter copy-mode                            # prefix + Enter = 복사 모드 진입
bind -T copy-mode-vi v send -X begin-selection  # v로 선택 시작
bind -T copy-mode-vi y send -X copy-selection   # y로 복사

# --- 상태바 (catppuccin mocha 테마) ---
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# 배경: 짙은 회색 / 텍스트: 밝은 회색
set -g status-style "fg=#cdd6f4,bg=#1e1e2e"
set -g status-left-length 40
set -g status-right-length 80

# 왼쪽: 세션 이름
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold]  #S #[fg=#89b4fa,bg=#1e1e2e] "

# 오른쪽: 호스트 · 날짜 · 시간
set -g status-right "#[fg=#585b70]#[fg=#cdd6f4,bg=#585b70] #H #[fg=#89b4fa,bg=#585b70]#[fg=#1e1e2e,bg=#89b4fa,bold] %m/%d %H:%M "

# 비활성 윈도우 탭
setw -g window-status-format "#[fg=#585b70,bg=#1e1e2e] #I #[fg=#a6adc8,bg=#1e1e2e]#W "

# 활성 윈도우 탭
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I #[fg=#cdd6f4,bg=#45475a,bold] #W "

setw -g window-status-separator ""

# 패널 경계선
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# 메시지 스타일
set -g message-style "fg=#cdd6f4,bg=#45475a"
set -g message-command-style "fg=#cdd6f4,bg=#45475a"

# 복사 모드 선택 색상
setw -g mode-style "fg=#1e1e2e,bg=#89b4fa"

# --- 플러그인 (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect 설정
set -g @resurrect-capture-pane-contents 'on'    # 패널 내용도 저장
set -g @continuum-restore 'on'                  # tmux 시작 시 자동 복원
set -g @continuum-save-interval '15'            # 15분마다 자동 저장

# --- SSH 연결 끊김 대비 ---
set -g destroy-unattached off        # 연결 끊겨도 세션 유지
set -g detach-on-destroy off         # 세션 종료 시 다른 세션으로 전환

# --- 활동 알림 ---
setw -g monitor-activity on
set -g visual-activity off           # 메시지 대신 상태바 하이라이트로만 알림

# --- TPM 초기화 (반드시 맨 아래) ---
run '~/.tmux/plugins/tpm/tpm'
