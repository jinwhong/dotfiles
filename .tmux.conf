# =============================================================================
# tmux.conf — SSH + Claude Code 워크플로우 최적화
# 요구사항: tmux 3.2+ (3.5a 권장)
# =============================================================================

# --- Prefix ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- 기본 설정 ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"  # truecolor 지원
set -g history-limit 50000           # 스크롤백 대폭 확대 (기본 2000)
set -g escape-time 0                 # ESC 지연 제거 (vim 사용자 필수)
set -g display-time 3000             # 메시지 표시 시간 3초
set -g repeat-time 300               # 반복 입력 대기 시간
set -g focus-events on               # 포커스 이벤트 전달
set -g mouse on                      # 패널별 스크롤 + 클릭 패널 전환

# --- 번호 매기기 ---
set -g base-index 1                  # 윈도우 1번부터
setw -g pane-base-index 1            # 패널도 1번부터
set -g renumber-windows on           # 윈도우 닫으면 번호 재정렬

# --- 윈도우 이동 (Ctrl+Shift+화살표, prefix 불필요) ---
bind -n C-S-Left  previous-window
bind -n C-S-Right next-window

# --- 윈도우 & 패널 분할 ---
bind | split-window -h -c "#{pane_current_path}"   # 수평 분할 (현재 경로 유지)
bind - split-window -v -c "#{pane_current_path}"   # 수직 분할 (현재 경로 유지)
bind c new-window -c "#{pane_current_path}"         # 새 윈도우도 현재 경로

# --- 패널 이동 (vim 스타일) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- 패널 리사이즈 ---
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# --- 빠른 조작 ---
bind r source-file ~/.tmux.conf \; display "Config reloaded!"  # prefix + r = 설정 리로드
bind X confirm-before -p "kill-session? (y/n)" kill-session     # 세션 종료 확인
bind S command-prompt -p "new session:" "new-session -s '%%'"   # 빠른 세션 생성

# --- 복사 모드 (vi 스타일) ---
setw -g mode-keys vi
bind Enter copy-mode                            # prefix + Enter = 복사 모드 진입
bind -T copy-mode-vi v send -X begin-selection  # v로 선택 시작
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"  # y로 복사 (macOS 클립보드 + 모드 종료)

# --- 상태바 (dracula 테마) ---
set -g status-interval 5
set -g status-position bottom

# dracula 설정
set -g @dracula-show-powerline true
set -g @dracula-plugins "mac-player directory cpu-usage ram-usage battery time"
set -g @dracula-show-left-icon "#(scutil --get ComputerName)"
set -g @dracula-show-flags true
set -g @dracula-border-contrast true
set -g @dracula-time-format "%m/%d %H:%M"
set -g @dracula-cpu-usage-label " "
set -g @dracula-ram-usage-label "󰍛 "
set -g @dracula-battery-label "󰁹 "

# 위젯 색상 통일 (dark_purple + white 톤)
set -g @dracula-cpu-usage-colors "dark_purple white"
set -g @dracula-ram-usage-colors "gray white"
set -g @dracula-battery-colors "dark_purple white"
set -g @dracula-time-colors "gray white"
set -g @dracula-directory-colors "dark_purple white"
set -g @dracula-mac-player-colors "gray white"

# --- SSH 연결 끊김 대비 ---
set -g destroy-unattached off        # 연결 끊겨도 세션 유지
set -g detach-on-destroy off         # 세션 종료 시 다른 세션으로 전환

# --- 활동 알림 ---
setw -g monitor-activity on
set -g visual-activity off           # 메시지 대신 상태바 하이라이트로만 알림

# --- 플러그인 (tpm) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'     # prefix + C-s 저장, prefix + C-r 복원
set -g @plugin 'tmux-plugins/tmux-continuum'     # 자동 저장/복원
set -g @plugin 'dracula/tmux'                    # 상태바 테마

# resurrect/continuum 설정
set -g @resurrect-capture-pane-contents 'on'     # 패널 내용도 저장
set -g @continuum-restore 'on'                   # tmux 시작 시 자동 복원
set -g @continuum-save-interval '15'             # 15분마다 자동 저장

# tpm 초기화 (반드시 맨 마지막)
run '~/.tmux/plugins/tpm/tpm'
